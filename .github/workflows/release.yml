name: Release

# Publishing happens here rather than from a laptop, so that npm can attest where
# the tarball came from. A package published by hand carries no link back to the
# commit it was built from: the registry signs what it receives, which proves only
# that storage did not tamper with it. Provenance is what proves the source.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # The OIDC token npm exchanges for short-lived publish rights. Without this the
      # job cannot authenticate at all - there is no fallback token by design.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer. The bundled version tracks the
      # Node release and is not guaranteed to clear that bar, so it is raised rather
      # than assumed - the failure otherwise is an authentication error that reads
      # like a misconfigured trusted publisher.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm -v

      # A tag that disagrees with package.json publishes a version nobody asked for,
      # and npm versions are immutable once taken. Cheaper to fail here.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Last line of defence: refuse to publish a version that already exists, rather
      # than discovering it from a failed publish halfway through.
      - name: Version must not already be published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VER is already on the registry"
            exit 1
          fi

      # No NODE_AUTH_TOKEN. Authentication is the OIDC exchange above, which is why
      # there is no long-lived credential in this repository to steal.
      - name: Publish with provenance
        run: npm publish --provenance --access public
